<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>제시 단어 수순 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* 원고지: 칸 하나에 음절 하나. 지도는 원고지 한 장, 수순은 원고지 한 줄로 적어 내려간다. */
:root {
  --paper: #fbfcf9;
  --sheet: #ffffff;
  --rule: #9cc3ad;
  --rule-soft: #d7e8de;
  --ink: #1b2620;
  --ink-soft: #55665c;
  --accent: #2f7a55;
  --win: #1f6f4a;
  --win-bg: #dcefe4;
  --lose: #b23a2b;
  --lose-bg: #f7e1dc;
  --open: #6b7570;
  --open-bg: #ecefed;
  --astra: #6a4fa3;
  --astra-bg: #ebe5f6;
  --focus: #1d5fd1;
  --shadow: 0 1px 0 rgba(27, 38, 32, .06);
  --f-display: "Nanum Myeongjo", "AppleMyungjo", "Noto Serif KR", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --cell: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101814; --sheet: #142019; --rule: #3b6550; --rule-soft: #22362b; --ink: #e4ede7; --ink-soft: #9db3a6;
    --accent: #6cc79a; --win: #7fd6a6; --win-bg: #173726; --lose: #f19a8a; --lose-bg: #3d1f1a; --open: #a3aea8; --open-bg: #1f2a25;
    --astra: #c2adf0; --astra-bg: #2a2340; --focus: #8ab4ff; --shadow: 0 1px 0 rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101814; --sheet: #142019; --rule: #3b6550; --rule-soft: #22362b; --ink: #e4ede7; --ink-soft: #9db3a6;
  --accent: #6cc79a; --win: #7fd6a6; --win-bg: #173726; --lose: #f19a8a; --lose-bg: #3d1f1a; --open: #a3aea8; --open-bg: #1f2a25;
  --astra: #c2adf0; --astra-bg: #2a2340; --focus: #8ab4ff; --shadow: 0 1px 0 rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--paper); color: var(--ink); }
body { font: 15px/1.6 var(--f-body); }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 22px; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; text-wrap: balance; margin: 0; line-height: 1.25; }
h1 { font-size: clamp(26px, 5vw, 36px); letter-spacing: -.01em; }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
.lede { color: var(--ink-soft); max-width: 62ch; margin: 6px 0 0; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--ink-soft); }
.mono { font-family: var(--f-mono); font-size: 12px; }

/* 머리말 */
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; border-bottom: 2px solid var(--rule); padding-bottom: 14px; }
.tally { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.pill.win { background: var(--win-bg); color: var(--win); }
.pill.lose { background: var(--lose-bg); color: var(--lose); }
.pill.open { background: var(--open-bg); color: var(--open); }
.pill.astra { background: var(--astra-bg); color: var(--astra); }
.pill b { font-family: var(--f-mono); font-weight: 500; }

/* 원고지 지도 */
.sheet { background: var(--sheet); border: 1px solid var(--rule); box-shadow: var(--shadow); padding: 14px; }
.grid { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
.cell { position: relative; aspect-ratio: 1; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: clamp(16px, 2.4vw, 22px); background: none; border-top: 0; border-left: 0; padding: 0; cursor: pointer; min-width: 0; }
.cell.win { background: var(--win-bg); color: var(--win); }
.cell.lose { background: var(--lose-bg); color: var(--lose); }
.cell.astra { background: var(--astra-bg); color: var(--astra); }
.cell.open { color: var(--open); cursor: default; }
.cell .mark { position: absolute; top: 2px; right: 3px; font: 600 10px/1 var(--f-mono); color: var(--lose); }
.cell .ring { position: absolute; inset: 14%; border: 1.5px solid var(--lose); border-radius: 50%; opacity: .45; pointer-events: none; }
.cell .ring.none { border: 1.5px dashed var(--open); opacity: .7; }
.cell .of { position: absolute; bottom: 2px; left: 4px; font: 500 10px/1 var(--f-body); color: var(--ink-soft); }
.cell.dead { cursor: default; background: repeating-linear-gradient(135deg, var(--lose-bg) 0 6px, var(--sheet) 6px 9px); }
.cell:hover:not(.open):not(.dead) { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--ink-soft); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 14px; height: 14px; border: 1px solid var(--rule); display: inline-block; }
.sw.win { background: var(--win-bg); } .sw.lose { background: var(--lose-bg); } .sw.astra { background: var(--astra-bg); } .sw.open { background: var(--sheet); }
.sw.ring { border-radius: 50%; border: 1.5px solid var(--lose); background: none; }
.sw.none { border-radius: 50%; border: 1.5px dashed var(--open); background: none; }
.sw.dead { background: repeating-linear-gradient(135deg, var(--lose-bg) 0 4px, var(--sheet) 4px 6px); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--rule); background: var(--sheet); padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
#view { display: grid; gap: 34px; }
.section > *, #view > * { min-width: 0; }
.section { display: grid; gap: 10px; }
.note { font-size: 13px; color: var(--ink-soft); max-width: 70ch; }

/* 탐색기 */
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--rule); background: var(--sheet); padding: 7px 14px; cursor: pointer; font-size: 14px; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: default; }
.title-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.meta { font-size: 13px; color: var(--ink-soft); }
.line { display: flex; flex-wrap: wrap; gap: 0; border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); background: var(--sheet); }
.word { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); background: none; border-top: 0; border-left: 0; padding: 0; cursor: pointer; display: grid; text-align: left; }
.word .boxes { display: flex; }
.word .boxes i { font-style: normal; width: 30px; height: 34px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 18px; border-right: 1px solid var(--rule-soft); }
.word .boxes i:last-child { border-right: 0; }
.word .who { font-size: 11px; padding: 1px 6px 2px; color: var(--ink-soft); border-top: 1px solid var(--rule-soft); white-space: nowrap; }
.word.recv .boxes { color: var(--accent); }
.word.pres .boxes { color: var(--ink); }
.word.start .boxes { color: var(--ink-soft); }
.word.here { box-shadow: inset 0 -3px 0 var(--accent); }
button.word:hover { background: var(--rule-soft); }
.word.given .boxes { color: var(--ink-soft); }
.now { display: grid; gap: 6px; padding: 14px 16px; border: 1px solid var(--rule); background: var(--sheet); }
.now .big { font-family: var(--f-display); font-size: 20px; font-weight: 800; }
.verdict { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.moves { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 8px; }
.mv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; text-align: left; border: 1px solid var(--rule); border-left-width: 4px; background: var(--sheet); padding: 9px 12px; cursor: pointer; min-width: 0; }
.mv:hover { border-color: var(--accent); }
.mv.win { border-left-color: var(--win); }
.mv.lose { border-left-color: var(--lose); }
.mv.open { border-left-color: var(--rule); }
.mv .w { font-family: var(--f-display); font-weight: 800; font-size: 18px; overflow-wrap: anywhere; }
.mv .alt { font-size: 12px; color: var(--ink-soft); grid-column: 1 / -1; }
.mv .why { font-size: 13px; color: var(--ink-soft); grid-column: 1 / -1; }
.mv .why b { color: var(--ink); font-weight: 600; }
.tag { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.tag.win { background: var(--win-bg); color: var(--win); }
.tag.lose { background: var(--lose-bg); color: var(--lose); }
.tag.open { background: var(--open-bg); color: var(--open); }
.loading { color: var(--ink-soft); font-size: 14px; }
.err { color: var(--lose); font-size: 14px; }
details.proofs { font-size: 13px; color: var(--ink-soft); }
details.proofs summary { cursor: pointer; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; font-size: 13px; min-width: 520px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--rule-soft); padding: 4px 10px 4px 0; text-align: left; vertical-align: top; }
.tbl td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
footer { font-size: 12px; color: var(--ink-soft); border-top: 1px solid var(--rule); padding-top: 12px; display: grid; gap: 4px; }
@media (max-width: 640px) {
  .grid { grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .word .boxes i { width: 26px; height: 30px; font-size: 16px; }
}
@media (prefers-reduced-motion: no-preference) {
  .mv, .cell, .chip, .btn { transition: border-color .12s, background-color .12s; }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div>
      <div class="eyebrow">기초사전 루트 817단어 · 표준두음법칙 · 한 경기 안 재사용 금지</div>
      <h1>제시 단어 수순 지도</h1>
      <p class="lede" id="lede">어떤 단어로 음절을 제시했는지에 따라 판정과 그 뒤의 수순을 봅니다. 수순은 그 자리의 검증된 증명서에서만 가져옵니다.</p>
    </div>
    <div class="tally" id="tally"></div>
  </header>
  <main id="view"><p class="loading">자료를 불러오는 중…</p></main>
  <footer id="foot"></footer>
</div>

<script src="site-engine.js" charset="utf-8"></script>
<script>
"use strict";
(function () {
  var model, manifest, pindex, entries = [], byId = {}, groupOf = {};
  var view = document.getElementById("view");
  var state = { entry: null, history: [], token: 0 }, keyboard = false;
  document.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " " || ev.key === "Tab") keyboard = true; }, true);
  document.addEventListener("pointerdown", function () { keyboard = false; }, true);

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(n) { return Number(n).toLocaleString("ko-KR"); }
  function jong(w) { var c = w.charCodeAt(w.length - 1) - 0xac00; return c >= 0 && c < 11172 ? c % 28 : 0; }
  function josa(w, a, b) { return w + (jong(w) ? a : b); }
  function ro(w) { var j = jong(w); return w + (j === 0 || j === 8 ? "로" : "으로"); }
  function hex(s) { return Array.from(s).map(function (c) { return ("000" + c.charCodeAt(0).toString(16)).slice(-4); }).join(""); }
  function unwasm(buf) {
    var u = new Uint8Array(buf), p = 9;
    if (u.length < 10 || u[0] !== 0 || u[1] !== 0x61 || u[2] !== 0x73 || u[3] !== 0x6d || u[8] !== 0) throw new Error("표 파일 형식이 맞지 않아요.");
    function leb() { var r = 0, s = 1, b; do { b = u[p++]; r += (b & 0x7f) * s; s *= 128; } while (b & 0x80); return r; }
    var size = leb(), end = p + size, nameLen = leb();
    p += nameLen;
    if (end !== u.length) throw new Error("표 파일 크기가 맞지 않아요.");
    return buf.slice(p, end);
  }
  function get(p, type) {
    return fetch(p).then(function (r) {
      if (!r.ok) throw new Error(p + "를 불러오지 못했어요 (" + r.status + ").");
      return type === "json" ? r.json() : r.arrayBuffer().then(unwasm);
    });
  }
  var VERDICT = { W: ["제시자 패", "받은 쪽 승", "lose"], L: ["제시자 승", "받은 쪽 패", "win"] };
  function verdictPill(st, t) {
    if (st === "W" || st === "L") { var v = VERDICT[st]; return '<span class="pill ' + v[2] + '">' + v[0] + " · " + esc(t) + josa(t, "을", "를").slice(t.length) + " " + v[1] + "</span>"; }
    return '<span class="pill open">미확정</span>';
  }

  // ── 제시한 음절 목록 ───────────────────────────────────
  function counts(items) {
    var c = { W: 0, L: 0, open: 0 };
    items.forEach(function (it) { c[it.status === "W" || it.status === "L" ? it.status : "open"]++; });
    return c;
  }
  function renderMap() {
    state.entry = null; state.token++;
    var all = [].concat.apply([], pindex.groups.map(function (g) { return g.items; })), c = counts(all);
    var pr = pindex.progress;
    document.getElementById("tally").innerHTML =
      '<span class="pill lose">제시자 패 <b>' + c.W + "</b></span>" + '<span class="pill win">제시자 승 <b>' + c.L + "</b></span>" +
      '<span class="pill open">미확정 <b>' + c.open + "</b></span>";
    var cells = pindex.groups.map(function (g) {
      var k = counts(g.items), cls = k.L ? "win" : k.open ? "" : "lose";
      var title = g.t + " 제시: 제시 단어 " + g.items.length + "개 · 제시자 패 " + k.W + " · 제시자 승 " + k.L + " · 미확정 " + k.open;
      return '<button class="cell ' + cls + '" data-t="' + esc(g.t) + '" title="' + esc(title) + '">' +
        esc(g.t) + '<span class="of">' + g.items.length + "</span>" + (k.open ? '<span class="ring none" aria-hidden="true"></span>' : "") + "</button>";
    }).join("");
    view.innerHTML =
      '<div class="section"><h2>제시한 음절</h2>' +
        '<p class="note">음절 t를 누르면, t를 제시한 단어(<b>~t</b> 단어)마다 판정과 수순을 볼 수 있습니다.</p>' +
        '<div class="sheet"><div class="grid">' + cells + "</div>" +
        '<div class="legend"><span><i class="sw lose"></i>모든 제시 단어가 제시자 패</span><span><i class="sw win"></i>제시자가 이기는 단어가 있음</span><span><i class="sw none"></i>미확정 단어가 있음</span><span>칸 아래 숫자: 이 연구의 제시 단어 수</span></div></div></div>' +
      '<div class="section"><h2>이 지도에 담긴 것</h2><ul class="note">' +
        "<li><b>" + fmt(pr.verified) + "/" + fmt(pr.targets) + "</b>는 이번 추가 조사 대상의 진행률입니다. 대상은 받는 쪽이 이기는 음절 64개에서 받는 쪽이 낼 수 있는 첫 단어를, 낸 뒤 국면이 같은 것끼리 묶은 " + fmt(pr.targets) + "개입니다. 모든 제시 단어나 모든 후속 갈래를 분석한 비율이 아닙니다.</li>" +
        "<li>제시 자리 " + fmt(pr.targets) + "개: <b>자체 수순 " + fmt(pr.own) + "</b> · <b>기존 수순 " + fmt(pr.old) + "</b> · <b>미확정 " + fmt(pr.left) + "</b>.</li>" +
        "<li><b>자체 수순</b>은 그 자리(<b>w로 t 제시</b>: w를 이미 썼고 상대가 t를 받은 자리)의 v4 증명서 하나에서만 가져옵니다. 다른 이력의 결과를 붙이지 않습니다.</li>" +
        "<li><b>기존 수순</b>은 예전 연구(verify_v2)에서 검증한 자리입니다. 기존 ‘루트 수순 지도’의 표를 그대로 담아, 그 증명의 사용 이력(s를 받고 w를 낸 자리) 그대로 엽니다.</li>" +
      "</ul></div>" +
      '<div class="section"><h2>읽는 법</h2><ul class="note">' +
        "<li><b>제시자</b>는 ~t 단어를 내서 상대에게 t를 넘긴 사람(낸 쪽), <b>받은 쪽</b>은 t로 시작하는 단어를 내야 하는 사람입니다. 수순에서는 받은 쪽이 먼저 둡니다.</li>" +
        "<li><b>제시자 패 · 받은 쪽 승</b>은 그 단어로 제시하면 제시자가 진다는 뜻입니다. 기록의 ‘지는 수’입니다.</li>" +
        "<li>지는 쪽의 수는 모두 끝까지 확인했습니다. 지는 쪽이 어떤 수를 골라도 이기는 쪽의 다음 승리수를 따라갈 수 있습니다.</li>" +
        "<li>이기는 쪽은 증명이 고른 수 하나만 ‘이기는 수’입니다. 분석하지 않은 다른 선택지는 <b>미확인</b>으로 보입니다.</li>" +
        "<li>증명은 단어 묶음과 줄인 국면으로 적혀 있습니다. 이 지도는 실제 단어로 되돌려 보여 줍니다: <b>되받기</b>(왕복 쌍의 짝으로 받아 직전 국면으로 돌림), <b>정적</b>(남은 연결만으로 결정), <b>한 수</b>(상대를 정적으로 지는 자리로 보냄).</li>" +
        "<li>브라우저의 뒤로 가기는 한 수 전으로 돌아갑니다. 주소를 보내면 같은 수순이 열립니다.</li>" +
      "</ul></div>";
    view.querySelectorAll("[data-t]").forEach(function (b) { b.addEventListener("click", function () { location.hash = "#t" + hex(b.dataset.t); }); });
  }

  function renderSyllable(t) {
    state.entry = null; state.token++;
    var g = groupOf[t];
    if (!g) return renderMap();
    var rows = g.items.map(function (it) {
      var label = it.words.join(" · "), how;
      if (it.status === "open") how = '<span class="why">아직 판정하지 않음(재생·직접 탐색 한도 안에 결론이 나지 않음)</span>';
      else if (it.kind === "own") how = '<span class="why">자체 수순 · 이 자리의 v4 증명서 · 국면 ' + fmt(it.proof.nodes) + "개</span>";
      else how = '<span class="why">기존 수순 · 예전 연구의 증명(verify_v2) · ' + esc(it.start) + " 받음에서 " + esc(josa(it.words[0], "을", "를")) + " 낸 이력 그대로</span>";
      var tag = it.status === "W" ? '<span class="tag lose">제시자 패</span>' : it.status === "L" ? '<span class="tag win">제시자 승</span>' : '<span class="tag open">미확정</span>';
      var href = it.status === "open" ? "" : "#e" + hex(t + "<" + it.words[0]);
      var cls = it.status === "W" ? "lose" : it.status === "L" ? "win" : "open";
      return (href ? '<a class="mv ' + cls + '" style="text-decoration:none;color:inherit" href="' + esc(href) + '"' +  + ">" : '<div class="mv open" style="cursor:default">') +
        '<span class="w">' + esc(ro(it.words[0])) + " " + esc(t) + " 제시</span>" + tag +
        (it.words.length > 1 ? '<span class="alt">같은 자리: ' + esc(it.words.slice(1).join(", ")) + "</span>" : "") + how + (href ? "</a>" : "</div>");
    }).join("");
    var k = counts(g.items);
    view.innerHTML = '<div class="section">' +
      '<div class="bar"><button class="btn" id="toMap">← 제시한 음절</button></div>' +
      '<div class="title-row"><h2>' + esc(t) + ' 제시</h2><span class="meta">제시 단어 ' + g.items.length + "개 · 제시자 패 " + k.W + " · 제시자 승 " + k.L + " · 미확정 " + k.open + "</span></div>" +
      '<p class="note">' + esc(t) + josa(t, "을", "를").slice(t.length) + " 제시하는 단어(~" + esc(t) + ")마다, 그 단어를 이미 쓰고 상대가 " + esc(t) + josa(t, "을", "를").slice(t.length) + " 받은 자리의 판정입니다. 이 연구의 범위 밖인 제시 단어는 목록에 없습니다.</p>" +
      '<div class="moves">' + rows + "</div></div>";
    document.getElementById("toMap").onclick = function () { location.hash = "#map"; };
  }

  // ── 탐색기 ────────────────────────────────────────────
  function legalSorted(e, h) {
    var a = RouteSite.position(e.start, e.prefix.concat(h)), list = [];
    model.outgoing[a.cur].forEach(function (g) { model.words[g].forEach(function (w) { if (!a.used[w]) list.push(w); }); });
    return list.sort();
  }
  function hashFor(e, h) {
    var idx = [], i;
    for (i = 0; i < h.length; i++) idx.push(legalSorted(e, h.slice(0, i)).indexOf(h[i]));
    return "#e" + hex(e.id) + (idx.length ? "-" + idx.join("-") : "");
  }
  function fromHash(hash) {
    var m = /^#e([0-9a-f]+)((?:-\d+)*)$/.exec(hash || "");
    var e = m && entries.filter(function (x) { return hex(x.id) === m[1]; })[0];
    if (!e) return null;
    var h = [], parts = m[2] ? m[2].slice(1).split("-") : [];
    for (var i = 0; i < parts.length; i++) { var l = legalSorted(e, h), w = l[+parts[i]]; if (!w) break; h.push(w); }
    return { entry: e, history: h };
  }
  function side(i) { return i % 2 ? "제시자" : "받은 쪽"; }
  function sideLong(e, toMove) {
    return toMove === "receiver" ? "받은 쪽(" + e.syllable + josa(e.syllable, "을", "를").slice(e.syllable.length) + " 받은 사람)" : "제시자(" + e.via + josa(e.via, "을", "를").slice(e.via.length) + " 낸 사람)";
  }
  function open(e, h) { state.entry = e; state.history = h.slice(); go(); }
  function go() { var hs = hashFor(state.entry, state.history); if (location.hash !== hs) location.hash = hs; else renderExplorer(); }
  function wordBoxes(w) { return '<span class="boxes">' + Array.from(w).map(function (ch) { return "<i>" + esc(ch) + "</i>"; }).join("") + "</span>"; }
  function statusLine(a) {
    var mover = a.toMove === "receiver" ? "받은 쪽이" : "제시자가";
    if (a.end) return '<span class="pill lose">' + mover + " 낼 단어가 없어 집니다</span>";
    if (a.status === "W") return '<span class="pill win">' + mover + " 이기는 국면</span><span class=\"meta\">근거: " + esc(a.how) + "</span>";
    if (a.status === "L") return '<span class="pill lose">' + mover + " 지는 국면</span><span class=\"meta\">근거: " + esc(a.how) + "</span>";
    return '<span class="pill open">판정 없음</span><span class="meta">증명 밖으로 나온 수순입니다. 이기는 쪽이 증명에 없는 수(미확인)를 두면 여기로 옵니다.</span>';
  }
  function moveRow(mv, a) {
    var cls = mv.status === "win" ? "win" : mv.status === "lose" ? "lose" : "open";
    var tag = mv.status === "win" ? "이기는 수" : mv.status === "lose" ? "지는 수" : "미확인";
    var why;
    if (mv.status === "lose" && mv.reply) why = "상대가 <b>" + esc(mv.reply.word) + "</b>" + (mv.reply.how === "되받기" ? "(짝)으로 되받음" : ro(mv.reply.word).slice(mv.reply.word.length) + " 받음") + " · " + esc(mv.how);
    else if (mv.status === "lose") why = "근거: " + esc(mv.how);
    else if (mv.status === "win") why = (a.best && a.best.group === mv.group ? (mv.how === "증명" ? "증명의 수" : "이기는 수") : "이 수도 이김(한 수 앞까지 증명)") + " · 근거: " + esc(mv.how);
    else why = a.status === "W" ? "이기는 쪽의 다른 선택지 · 분석하지 않음" : "확인하지 못한 수";
    var alts = mv.words.length > 1 ? '<span class="alt">같은 결과: ' + esc(mv.words.slice(1).join(", ")) + "</span>" : "";
    return '<button class="mv ' + cls + '" data-word="' + esc(mv.words[0]) + '"><span class="w">' + esc(mv.words[0]) + '</span><span class="tag ' + cls + '">' + tag + "</span>" + alts + '<span class="why">' + why + "</span></button>";
  }
  function renderExplorer() {
    var e = state.entry, h = state.history, token = ++state.token;
    var line = e.prefix.map(function (w) { return '<span class="word given" title="제시 단어">' + wordBoxes(w) + '<span class="who">제시 단어</span></span>'; }).join("") +
      '<button class="word start' + (h.length ? "" : " here") + '" data-back="0"><span class="boxes"><i>' + esc(e.syllable) + '</i></span><span class="who">받은 음절</span></button>' +
      h.map(function (w, i) { return '<button class="word ' + (i % 2 ? "pres" : "recv") + (i === h.length - 1 ? " here" : "") + '" data-back="' + (i + 1) + '">' + wordBoxes(w) + '<span class="who">' + (i + 1) + ". " + side(i) + "</span></button>"; }).join("");
    var v = VERDICT[e.result];
    var p = e.proof, old = e.src === "old";
    view.innerHTML =
      '<div class="section">' +
        '<div class="bar"><button class="btn" id="toList">← ' + esc(e.syllable) + ' 제시 목록</button><button class="btn" id="undo"' + (h.length ? "" : " disabled") + '>한 수 무르기</button><button class="btn" id="restart"' + (h.length ? "" : " disabled") + '>처음으로</button><button class="btn primary" id="play" disabled>이기는 수 두기</button></div>' +
        '<div class="title-row"><h2>' + esc(ro(e.via)) + " " + esc(e.syllable) + ' 제시</h2><span class="pill ' + v[2] + '">' + v[0] + " · 받은 쪽 " + (e.result === "W" ? "승" : "패") + "</span></div>" +
        (old ?
        '<details class="proofs"><summary>근거: 기존 수순 · 예전 연구의 증명 (verify_v2 통과)</summary><div class="tbl"><table><tbody>' +
          "<tr><th>자리</th><td>" + esc(e.start) + " 받음 → " + esc(e.via) + " (제시) → " + esc(e.syllable) + " 받을 차례</td></tr>" +
          "<tr><th>증명</th><td>" + esc(p.position.join(" → ")) + " 의 증명 · 국면 " + fmt(p.nodes) + "개</td></tr>" +
          '<tr><th>proof_sha256</th><td class="mono">' + esc(p.sha256) + "</td></tr>" +
          "<tr><th>표</th><td>기존 ‘루트 수순 지도’의 ‘" + esc(p.book_name) + "’ 표 (증명 " + fmt(p.book_proofs) + "개)</td></tr>" +
        "</tbody></table></div><p class=\"meta\">기존 지도와 같은 표를 그대로 씁니다. 이 자리는 그 증명에서 " + esc(josa(e.start, "을", "를")) + " 받고 " + esc(josa(e.via, "을", "를")) + " 낸 이력 그대로 엽니다." +
          (p.book_proofs > 1 ? " 이 표에는 같은 계열의 증명 " + fmt(p.book_proofs) + "개가 함께 들어 있습니다(기존 지도와 같음)." : "") + "</p></details>" :
        '<details class="proofs"><summary>근거: 자체 수순 · 이 자리의 v4 증명서 1개 (verify_v4 통과)</summary><div class="tbl"><table><tbody>' +
          "<tr><th>자리</th><td>" + esc(e.start) + " 받음 → " + esc(e.via) + " (제시) → " + esc(e.syllable) + " 받을 차례</td></tr>" +
          '<tr><th>증명 국면</th><td class="n">' + fmt(p.nodes) + "</td></tr>" +
          '<tr><th>proof_sha256</th><td class="mono">' + esc(p.sha256) + "</td></tr>" +
          "<tr><th>보관</th><td>" + (/^https:/.test(p.certificate) ? '<a href="' + esc(p.certificate) + '" target="_blank" rel="noopener">GitHub 릴리스 첨부파일</a>' : esc(p.certificate)) + "</td></tr>" +
          "<tr><th>기록</th><td>" + esc(p.source) + "</td></tr>" +
        "</tbody></table></div><p class=\"meta\">이 자리의 승리수 표에는 이 증명서의 수만 들어 있습니다. 다른 이력(다른 제시 단어, 빈 사전에서 받은 국면 등)의 결과는 쓰지 않습니다.</p></details>") +
        '<div class="line" id="line" aria-label="지금까지의 수순">' + line + "</div>" +
        '<div class="now" id="now" tabindex="-1" aria-live="polite"><span class="loading">계산하는 중…</span></div>' +
        '<div class="moves" id="moves"></div>' +
      "</div>";
    document.getElementById("toList").onclick = function () { location.hash = "#t" + hex(e.syllable); };
    document.getElementById("undo").onclick = function () { state.history.pop(); go(); };
    document.getElementById("restart").onclick = function () { state.history = []; go(); };
    view.querySelectorAll("[data-back]").forEach(function (b) { b.onclick = function () { state.history = state.history.slice(0, +b.dataset.back); go(); }; });
    RouteSite.analyze(e, h).then(function (a) {
      if (token !== state.token || !document.getElementById("now")) return;
      var now = document.getElementById("now"), mv = document.getElementById("moves"), play = document.getElementById("play");
      var shown = performance.now();
      var guard = function (fn) { return function (ev) { if (ev.detail > 1 || performance.now() - shown < 350) return; fn(); }; };
      now.innerHTML = '<span class="eyebrow">' + (h.length + 1) + "번째 수 · " + esc(sideLong(e, a.toMove)) + ' 차례</span><span class="big">‘' + esc(a.syllable) + "’" + ro(a.syllable).slice(a.syllable.length) + " 시작하는 단어</span>" +
        '<span class="verdict">' + statusLine(a) + "</span>";
      var order = { win: 0, lose: 1, "?": 2 };
      var list = a.moves.slice().sort(function (x, y) { return order[x.status] - order[y.status] || (x.words[0] < y.words[0] ? -1 : 1); });
      var winnerSide = a.toMove === "receiver" ? "제시자" : "받은 쪽";
      mv.innerHTML = a.end ? '<p class="note">더 낼 단어가 없습니다. <b>' + winnerSide + "</b>이 이겼습니다.</p>" : list.map(function (m) { return moveRow(m, a); }).join("");
      mv.querySelectorAll("[data-word]").forEach(function (b) { b.onclick = guard(function () { state.history.push(b.dataset.word); go(); }); });
      if (a.status === "W" && a.best) { play.disabled = false; play.textContent = "이기는 수 두기: " + a.best.words[0]; play.onclick = guard(function () { state.history.push(a.best.words[0]); go(); }); }
      if (keyboard) { var first = mv.querySelector(".mv"); (first || now).focus({ preventScroll: false }); }
    }).catch(function (err) {
      if (token !== state.token || !document.getElementById("now")) return;
      document.getElementById("now").innerHTML = '<span class="err">' + esc(err.message || String(err)) + "</span>";
    });
  }

  function route() {
    var m = /^#t([0-9a-f]{4,})$/.exec(location.hash);
    if (m) { var t = String.fromCharCode(parseInt(m[1].slice(0, 4), 16)); return renderSyllable(t); }
    var r = fromHash(location.hash);
    if (r) { state.entry = r.entry; state.history = r.history; renderExplorer(); }
    else renderMap();
  }

  Promise.all([get("model.json", "json"), get("manifest.json", "json"), get("pindex.json", "json")]).then(function (r) {
    model = r[0]; manifest = r[1]; pindex = r[2];
    RouteSite.init(model, manifest, function (p) { return get(p, "wasm"); });
    pindex.groups.forEach(function (g) {
      groupOf[g.t] = g;
      g.items.forEach(function (it) {
        if (it.status === "open") return;
        var e = { id: g.t + "<" + it.words[0], kind: "via", syllable: g.t, start: it.start, prefix: [it.words[0]], via: it.words[0], book: it.book, result: it.status, proof: it.proof, src: it.kind };
        entries.push(e); byId[e.id] = e;
      });
    });
    var books = manifest.books.length, recs = manifest.total_entries;
    document.getElementById("foot").innerHTML =
      "<span>표 " + fmt(books) + "개 · 승리수 표 " + fmt(recs) + "항목 · 자체 수순의 표는 그 자리의 v4 증명서(C++ verify_v4 통과)에서, 기존 수순의 표는 기존 ‘루트 수순 지도’에서 그대로 가져왔습니다.</span>" +
      "<span>단어 목록 sha256 " + esc(model.dictionary_sha256.slice(0, 16)) + "… · 진행률 " + fmt(pindex.progress.verified) + "/" + fmt(pindex.progress.targets) + "은 이번 추가 조사 대상 기준입니다.</span>";
    window.addEventListener("hashchange", route);
    route();
  }).catch(function (err) { view.innerHTML = '<p class="err">' + esc(err.message || String(err)) + "</p>"; });
})();
</script>

</body>
</html>
